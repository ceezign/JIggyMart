server {
    # Render terminates SSL at its edge and forwards plain HTTP here.
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    sendfile off;

    error_log /dev/stdout info;
    access_log /dev/stdout;

    location /.git {
        deny all;
        return 403;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # The important part: any URL that isn't a real file (e.g. /login,
    # /products) is handed to Laravel's front controller instead of 404ing.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff2?)$ {
        expires 5d;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
